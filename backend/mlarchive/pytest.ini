[pytest]
python_files = *.py
# --ds, not DJANGO_SETTINGS_MODULE below: pytest-django prefers the environment
# variable to the ini setting, and the dev container sets it to docker-development
addopts = --reuse-db --nomigrations --ds=mlarchive.settings.test
# log_print = False - deprecated
log_level = ERROR
DJANGO_SETTINGS_MODULE = mlarchive.settings.test
flakes-ignore =
    archive/admin.py ImportStarUsage ImportStarUsed
    archive/management/commands/_classes.py ImportStarUsage ImportStarUsed
    settings/test.py ImportStarUsage ImportStarUsed

[pycodestyle]
ignore = E128
maxlinelength = 120
